<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Phase 1 Practice: Core CSS Foundations</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <section class="lab-card" id="lab-selectors">
        <h2>Selectors & Specifictiy</h2>
        <p class="description"> Standard description text ! </p>
        <p class="highligthed" class="description">Highlighted text with class and id</p>

        <div class="badge-container">
            <span class="tag">Direct Child Tag</span>
            <div>
                <span child="tag">Nested Child Tag</span>
            </div>
        </div>

        <div class="button-group">
            <button type="button" class="action-btn">Active Button</button>
            <button type="button" class="action-btn" disabled>Disabled Button</button>
        </div>
    </section>
  </main>
</body>
</html>
